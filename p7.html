<!DOCTYPE html>
<html>
<head>
<title>BizHive Business Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
font-family: Arial, sans-serif;
background-color: white;
text-align: center;
padding: 20px;
}
h2 {
color: #203c32;
}
.gallery {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
}
.gallery img {
width: 100%;
height: 100px;
object-fit: cover;
border: 2px solid #203c32;
border-radius: 5px;
}
@media (max-width: 600px) {
.gallery {
grid-template-columns: repeat(2, 1fr);
}
}
</style>
</head>
<body>
<h2>BIZHIVE BUSINESS HUB</h2>
<h3>Responsive Business Image Gallery</h3>
<div class="gallery">
<img src="business-meeting.webp" alt="Business meeting">
<img src="office workspace.jpg" alt="Office workspace">
<img src="business team.jpg" alt="Business team">
<img src="business planing.jpg" alt="Business planning">
<img src="discussion.jpg" alt="Business discussion">
<img src="management.jpg" alt="Office management">
<img src="service.png" alt="Business services">
<img src="collaboration.jpg" alt="Team collaboration">
</div>
</body>
</html>
